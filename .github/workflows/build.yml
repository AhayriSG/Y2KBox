name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build_artifacts: ${{ steps.detect.outputs.build_artifacts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect whether binary artifacts are needed
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE"
            head="$CURRENT_SHA"
          fi

          # A new branch (or unavailable base) must build artifacts conservatively.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null ||
             ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            echo "build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If Git cannot calculate the diff, prefer producing artifacts over skipping them.
          if ! git diff --name-only "$base" "$head" > changed-files.txt; then
            echo "build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build_artifacts=true
          if [[ -s changed-files.txt ]]; then
            build_artifacts=false
            while IFS= read -r path; do
              if [[ "$path" != *.md ]]; then
                build_artifacts=true
                break
              fi
            done < changed-files.txt
          fi

          echo "Changed files:"
          cat changed-files.txt
          echo "build_artifacts=$build_artifacts" >> "$GITHUB_OUTPUT"

  linux:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip libglib2.0-dev libpixman-1-dev \
            libfdt-dev libslirp-dev libsdl2-dev libvulkan1 mesa-vulkan-drivers nasm pkg-config bc
          pip install --break-system-packages meson tomli || pip install meson tomli
      - name: Configure
        run: |
          mkdir build && cd build
          ../configure --target-list=i386-softmmu --disable-guest-agent --disable-werror --enable-sdl --disable-vnc --enable-kvm
      - name: Build
        run: ninja -C build qemu-system-i386 qemu-img
      - name: Checks (boot + memory-op test + CPUID)
        run: |
          cd build
          ./qemu-system-i386 -accel help | tee accel.txt
          grep -Eq '^kvm([[:space:]]|$)' accel.txt
          grep -qx tcg accel.txt
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            if ./qemu-system-i386 -L pc-bios -display none -monitor none -serial none -nodefaults -S > kvm-required.out 2>&1; then
              echo "default launch unexpectedly succeeded without accessible /dev/kvm" >&2
              exit 1
            fi
            grep -Fq 'You need KVM turned on for using Y2KBox on Linux.' kvm-required.out
          fi
          ./qemu-system-i386 -vga help | tee vga.txt
          grep -Eq '^vmware[[:space:]].*\(default\)$' vga.txt
          ! grep -Eq '^(cirrus|std)[[:space:]]' vga.txt
          ./qemu-system-i386 -device help | tee dev.txt
          grep -qw 'vmvga' dev.txt
          grep -qw 'virtio-net-pci' dev.txt
          grep -qw 'virtio-blk-pci' dev.txt
          nasm -fbin ../xp/bench/vmport_ring3_test.asm -o vmport_ring3.img
          ./qemu-system-i386 -L pc-bios -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=vmport_ring3.img,format=raw,if=ide \
            -chardev stdio,id=d -device isa-debugcon,iobase=0x402,chardev=d | tee vmport_ring3.out || true
          grep -q '^OK' vmport_ring3.out
          nasm -fbin ../xp/bench/vectest.asm -o vectest.img
          ./qemu-system-i386 -L pc-bios -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=vectest.img,format=raw,if=ide \
            -chardev stdio,id=d -device isa-debugcon,iobase=0x402,chardev=d | tee vectest.out || true
          grep -q '^OK' vectest.out
          nasm -fbin ../xp/bench/shuffletest.asm -o shuffletest.img
          ./qemu-system-i386 -L pc-bios -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=shuffletest.img,format=raw,if=ide \
            -chardev stdio,id=d -device isa-debugcon,iobase=0x402,chardev=d | tee shuffletest.out || true
          grep -q '^OK' shuffletest.out
          nasm -fbin ../xp/bench/packunpacktest.asm -o packunpacktest.img
          ./qemu-system-i386 -L pc-bios -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=packunpacktest.img,format=raw,if=ide \
            -chardev stdio,id=d -device isa-debugcon,iobase=0x402,chardev=d | tee packunpacktest.out || true
          grep -q '^OK' packunpacktest.out
          ./qemu-img create -f qcow2 t.qcow2 1G
      - name: x87 differential test (host fast path vs softfloat)
        run: bash xp/bench/x87cmp.sh build 2000
      - name: Package
        if: needs.changes.outputs.build_artifacts == 'true'
        run: |
          mkdir -p dist/pc-bios
          cp build/qemu-system-i386 build/qemu-img dist/
          cp pc-bios/*.bin pc-bios/*.rom dist/pc-bios/
          cp -r pc-bios/keymaps dist/pc-bios/keymaps
          if [ -d build/pc-bios/keymaps ]; then
            for f in build/pc-bios/keymaps/*; do
              [ -f "$f" ] && [ "$(basename "$f")" != "meson.build" ] && cp "$f" dist/pc-bios/keymaps/
            done
          fi
          rm -f dist/pc-bios/keymaps/meson.build
          mkdir -p dxvk-native
          curl -fsSL https://github.com/doitsujin/dxvk/releases/download/v3.1.1/dxvk-native-3.1.1-steamrt-sniper.tar.gz \
            | tar -xz -C dxvk-native
          cp -L dxvk-native/usr/lib/libdxvk_dxgi.so.0 dxvk-native/usr/lib/libdxvk_d3d9.so.0 \
            dxvk-native/usr/lib/libdxvk_d3d11.so.0 dist/
      - name: Smoke test the packaged layout (no -L, run from dist/, SDL present)
        if: needs.changes.outputs.build_artifacts == 'true'
        run: |
          ls -la dist dist/pc-bios | head -40
          cd dist
          ./qemu-system-i386 -display help | tee ../display.txt; grep -qw sdl ../display.txt
          ./qemu-system-i386 -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=../build/vectest.img,format=raw,if=ide \
            -chardev stdio,id=d -device isa-debugcon,iobase=0x402,chardev=d | tee ../packaged.out || true
          grep -q '^OK' ../packaged.out
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          Y2KBOX_3D_HEADLESS=1 ./qemu-system-i386 -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=../build/vmport_ring3.img,format=raw,if=ide \
            -chardev stdio,id=d -device isa-debugcon,iobase=0x402,chardev=d \
            > ../packaged3d.out 2> ../packaged3d.err || true
          cat ../packaged3d.err
          grep -q '^OK' ../packaged3d.out
          ! grep -q 'DXVK initialization failed' ../packaged3d.err
      - name: Upload binaries
        if: needs.changes.outputs.build_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: y2kbox-linux-x86_64
          path: dist
          retention-days: 14

  windows:
    needs: changes
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git base-devel
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-libslirp mingw-w64-ucrt-x86_64-dtc mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-nasm
      - name: Configure
        run: |
          mkdir build && cd build
          set +e
          ../configure --target-list=i386-softmmu --disable-guest-agent --disable-werror --enable-sdl --disable-vnc 2>&1 | tee configure.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            { tail -n 30 configure.log; echo '--- meson-log'; tail -n 25 meson-logs/meson-log.txt 2>/dev/null; } > err.txt
            msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=configure-failed::$msg"
            exit $rc
          fi
      - name: Build
        run: |
          set +e
          ninja -C build qemu-system-i386.exe qemu-img.exe 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -n -E "error|FAILED|undefined" build.log | head -25 > err.txt
            msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=build-failed::$msg"
            exit $rc
          fi
      - name: Checks
        run: |
          cd build
          ./qemu-system-i386.exe -accel help | tee accel.txt
          grep -qx tcg accel.txt
          ! grep -qx kvm accel.txt
          ./qemu-system-i386.exe -vga help | tee vga.txt
          grep -Eq '^vmware[[:space:]].*\(default\)$' vga.txt
          ! grep -Eq '^(cirrus|std)[[:space:]]' vga.txt
          ./qemu-system-i386.exe -device help | tee dev.txt
          grep -qw 'vmvga' dev.txt
          grep -qw 'virtio-net-pci' dev.txt
          grep -qw 'virtio-blk-pci' dev.txt
          nasm -fbin ../xp/bench/vmport_ring3_test.asm -o vmport_ring3.img
          ./qemu-system-i386.exe -L pc-bios -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=vmport_ring3.img,format=raw,if=ide \
            -chardev file,id=d,path=vmport_ring3.out -device isa-debugcon,iobase=0x402,chardev=d || true
          cat vmport_ring3.out; grep -q '^OK' vmport_ring3.out
          nasm -fbin ../xp/bench/vectest.asm -o vectest.img
          ./qemu-system-i386.exe -L pc-bios -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=vectest.img,format=raw,if=ide \
            -chardev file,id=d,path=vectest.out -device isa-debugcon,iobase=0x402,chardev=d || true
          cat vectest.out; grep -q '^OK' vectest.out
          nasm -fbin ../xp/bench/shuffletest.asm -o shuffletest.img
          ./qemu-system-i386.exe -L pc-bios -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=shuffletest.img,format=raw,if=ide \
            -chardev file,id=d,path=shuffletest.out -device isa-debugcon,iobase=0x402,chardev=d || true
          cat shuffletest.out; grep -q '^OK' shuffletest.out
          nasm -fbin ../xp/bench/packunpacktest.asm -o packunpacktest.img
          ./qemu-system-i386.exe -L pc-bios -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=packunpacktest.img,format=raw,if=ide \
            -chardev file,id=d,path=packunpacktest.out -device isa-debugcon,iobase=0x402,chardev=d || true
          cat packunpacktest.out; grep -q '^OK' packunpacktest.out
      - name: x87 differential test (host fast path vs softfloat)
        run: bash xp/bench/x87cmp.sh build 2000
      - name: Package (binaries, pc-bios, MSYS2 runtime DLLs)
        if: needs.changes.outputs.build_artifacts == 'true'
        run: |
          mkdir -p dist/pc-bios
          cp build/qemu-system-i386.exe build/qemu-img.exe dist/
          cp pc-bios/*.bin pc-bios/*.rom dist/pc-bios/
          cp -r pc-bios/keymaps dist/pc-bios/keymaps
          rm -f dist/pc-bios/keymaps/meson.build
          for exe in dist/*.exe; do ldd "$exe" | grep -i '/ucrt64/' | awk '{print $3}'; done | sort -u | xargs -I{} cp {} dist/
      - name: Smoke test the packaged layout (no -L, run from dist/, SDL present)
        if: needs.changes.outputs.build_artifacts == 'true'
        run: |
          ls -la dist dist/pc-bios | head -50
          cd dist
          ./qemu-system-i386.exe -display help | tee ../display.txt; grep -qw sdl ../display.txt
          ./qemu-system-i386.exe -accel tcg -display none -monitor none -serial none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=../build/vectest.img,format=raw,if=ide \
            -chardev file,id=d,path=../packaged.out -device isa-debugcon,iobase=0x402,chardev=d || true
          cat ../packaged.out; grep -q '^OK' ../packaged.out
      - name: Upload binaries
        if: needs.changes.outputs.build_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: y2kbox-windows-x86_64
          path: dist
          retention-days: 14
